# Checks, a release build, and a signed statement of where that build came from.
#
# The attestation is the point of the build job. `attest-build-provenance` signs,
# through Sigstore, a statement that this exact binary was produced by this
# workflow from this commit — so anyone who downloads the exe can check it came
# from the source in this repository and not from somebody's desktop:
#
#     gh attestation verify msi-hotkeys.exe --repo <owner>/msi-hotkeys
#
# What it does not claim is a reproducible build: rebuilding will not give
# byte-identical output, and the attestation says nothing about that. It
# establishes origin, not repeatability.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Jobs widen this for themselves, and only as far as they need.
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # The lint levels live in Cargo.toml; this makes any of them fatal here.
      - run: cargo clippy --all-targets -- -D warnings
      # The tests are all on pure functions, so no MSI hardware is needed. They
      # run on the debug profile deliberately: the release manifest asks for
      # administrator rights, and a test binary that demands elevation cannot be
      # launched by cargo at all.
      - run: cargo test

  # The floor in Cargo.toml is a claim, so it gets compiled rather than asserted.
  # It was 1.82 — the version that stabilised the `&raw mut` this code uses — until
  # this job was added and refused to build at all: cargo 1.82 cannot even parse
  # the manifest of toml 1.1.6. The dependencies set the floor, not our code, and
  # tray-icon 0.26 asks for the highest of them. Without this job the number was
  # decoration, which is exactly what it turned out to be.
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  build:
    runs-on: windows-latest
    needs: check
    permissions:
      contents: read
      id-token: write # Sigstore needs to mint an OIDC token
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Needs rc.exe from the Windows SDK for the manifest, icon and version
      # block; windows-latest has it.
      - run: cargo build --release

      - name: Report what was built
        run: |
          $exe = 'target/release/msi-hotkeys.exe'
          "sha256: {0}" -f (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "size:   {0:N0} bytes" -f (Get-Item $exe).Length

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/release/msi-hotkeys.exe

      - uses: actions/upload-artifact@v7
        with:
          name: msi-hotkeys
          path: target/release/msi-hotkeys.exe
          if-no-files-found: error

  release:
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # Confined to this job: nothing else here needs to write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: msi-hotkeys

      # The gh CLI ships on the runner, so the release needs no third-party
      # action — which matters for a repository whose point is verifiable origin.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash msi-hotkeys.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  msi-hotkeys.exe" | Set-Content msi-hotkeys.exe.sha256
          $notes = @"
          Обработчик аппаратных кнопок MSI — замена штатного SCM целиком, без ring-0 драйверов.

          **Только для платы MS-1796** (MSI GL72 6QD). Карта байтов EC снята с ACPI-таблиц одной
          машины, и программа в один из этих байтов пишет, поэтому на незнакомой плате она
          отказывается запускаться. Права администратора нужны и запрашиваются сами.

          ### Чего ожидать при первом запуске

          Бинарь не подписан сертификатом, поэтому SmartScreen покажет «Windows protected your PC»:
          «Подробнее» → «Выполнить в любом случае». Пара антивирусных движков может сработать
          ложно — программа просит права администратора, пишет в контроллер и запускает команды
          из ``actions.txt``, то есть делает ровно то, по чему эвристики узнают подозрительное.
          Исходники открыты, а происхождение этого файла проверяемо:

          ``````
          gh attestation verify msi-hotkeys.exe --repo ${{ github.repository }}
          ``````

          Проверка подтвердит, что файл собран GitHub Actions из коммита ${{ github.sha }},
          а не на чьём-то рабочем столе. Воспроизводимости это не обещает — только происхождение.

          SHA-256: ``$hash``
          "@
          gh release create ${{ github.ref_name }} `
            msi-hotkeys.exe msi-hotkeys.exe.sha256 `
            --repo ${{ github.repository }} `
            --title "${{ github.ref_name }}" `
            --notes $notes
